name: Bloodborne Optimized v2 - Windows x64

on:
  pull_request:
    branches: [bloodborne-readback-optimized-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-manual-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release

jobs:
  build-windows-x64:
    name: Full Windows build and tests
    runs-on: windows-2025-vs2026
    timeout-minutes: 120

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache CMake configuration
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/build
          key: windows-manual-cmake-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', '.gitmodules') }}
          restore-keys: |
            windows-manual-cmake-

      - name: Cache compiler output
        uses: hendrikmuhs/ccache-action@v1.2.21
        with:
          append-timestamp: false
          key: windows-manual-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

      - name: Configure CMake
        shell: pwsh
        run: >-
          cmake --fresh -G Ninja
          -B "${{ github.workspace }}/build"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Verify experimental readback base
        shell: pwsh
        run: |
          $required = @(
              @{ Path = 'src/video_core/amdgpu/fence_detector.h'; Pattern = 'FenceDetector' },
              @{ Path = 'src/video_core/buffer_cache/buffer_cache.cpp'; Pattern = 'ProcessPreemptiveDownloads' },
              @{ Path = 'src/video_core/buffer_cache/buffer_cache.cpp'; Pattern = 'defer_read_protect' },
              @{ Path = 'src/video_core/buffer_cache/buffer_cache.cpp'; Pattern = 'DownloadBufferSize = 128_MB' },
              @{ Path = 'src/core/emulator_settings.h'; Pattern = 'Optimized' },
              @{ Path = 'src/video_core/buffer_cache/readback_optimizer.h'; Pattern = 'PreemptivePagePolicy' },
              @{ Path = 'src/video_core/buffer_cache/readback_performance.cpp'; Pattern = 'SHADPS4_READBACK_PERF_TRACE' },
              @{ Path = 'src/video_core/buffer_cache/buffer_cache.cpp'; Pattern = 'UseOptimizedReadbacksV2' },
              @{ Path = 'src/core/libraries/network/p2p_port_config.cpp'; Pattern = 'P2PPort' }
          )
          foreach ($entry in $required) {
              if (-not (Select-String -LiteralPath $entry.Path -Pattern $entry.Pattern -Quiet)) {
                  throw "Missing experimental readback feature '$($entry.Pattern)' in $($entry.Path)"
              }
          }

      - name: Check Bloodborne trace formatting
        shell: pwsh
        run: clang-format --dry-run --Werror src/core/bloodborne_re.cpp

      - name: Build Release
        shell: pwsh
        run: >-
          cmake --build "${{ github.workspace }}/build"
          --config "${{ env.BUILD_TYPE }}"
          --parallel $env:NUMBER_OF_PROCESSORS

      - name: Configure all C++ tests
        shell: pwsh
        run: >-
          cmake --fresh -G Ninja
          -B "${{ github.workspace }}/build-tests"
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_TESTS=ON
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build all C++ tests
        shell: pwsh
        run: >-
          cmake --build "${{ github.workspace }}/build-tests"
          --parallel $env:NUMBER_OF_PROCESSORS

      - name: Run all reasonable C++ tests
        shell: pwsh
        run: >-
          ctest --test-dir "${{ github.workspace }}/build-tests"
          --output-on-failure --progress -E GcnTest

      - name: Package executable and runtime files
        shell: pwsh
        run: |
          $buildDir = Join-Path '${{ github.workspace }}' 'build'
          $packageDir = Join-Path '${{ github.workspace }}' 'artifact/windows-x64'
          $executable = Join-Path $buildDir 'shadPS4.exe'
          $packagedExecutable = Join-Path $packageDir 'shadPS4.exe'

          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "Build completed without producing $executable"
          }

          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -LiteralPath $executable -Destination $packagedExecutable
          Copy-Item -LiteralPath 'scripts/bloodborne_re/run-insight-trace.cmd' `
              -Destination (Join-Path $packageDir 'Run Bloodborne Insight Trace.cmd')
          Copy-Item -LiteralPath 'documentation/bloodborne-insight-trace.md' `
              -Destination (Join-Path $packageDir 'Bloodborne Insight Trace.md')

          $runtimeExtensions = '.dll', '.json', '.pak', '.dat'
          Get-ChildItem -LiteralPath $buildDir -File |
              Where-Object { $runtimeExtensions -contains $_.Extension.ToLowerInvariant() } |
              ForEach-Object {
                  Copy-Item -LiteralPath $_.FullName -Destination $packageDir -Force
              }

          Get-ChildItem -LiteralPath $packageDir -File |
              Sort-Object Name |
              Select-Object Name, Length

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: shadps4-windows-x64-optimized-v2
          path: ${{ github.workspace }}/artifact/windows-x64/
          if-no-files-found: error
          retention-days: 14
