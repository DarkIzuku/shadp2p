name: inFAMOUS First Light Async v2 - Windows x64

on:
  push:
    branches: [infamous-first-light-async-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infamous-first-light-async-v2-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  EXODUS_REF: 4ee4e92d0a72ff87f308ec432f696bb05d632348

jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - name: Clone latest GR2fork EXODUS
        shell: pwsh
        run: |
          git clone --recursive --branch GR2fork-EXODUS https://github.com/junminlee2004/GR2fork.git source
          Set-Location source
          git checkout "$env:EXODUS_REF"
          git submodule update --init --recursive
          git rev-parse HEAD | Out-File -Encoding ascii ../EXODUS_COMMIT.txt

      - name: Patch inFAMOUS cache self-heal
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          p = Path("source/src/video_core/renderer_vulkan/vk_pipeline_serialization.cpp")
          s = p.read_text(encoding="utf-8")

          if '#include "common/elf_info.h"' not in s:
              s = s.replace('#include "common/serdes.h"',
                            '#include "common/elf_info.h"\n#include "common/path_util.h"\n#include "common/serdes.h"')
          elif '#include "common/path_util.h"' not in s:
              s = s.replace('#include "common/elf_info.h"',
                            '#include "common/elf_info.h"\n#include "common/path_util.h"')

          marker = '    Storage::DataBase::Instance().Open();\n'
          if marker not in s:
              raise SystemExit("WarmUp database open marker not found")

          helper = r'''
              const auto rebuild_incompatible_cache = [&]() {
                  Storage::DataBase::Instance().Close();
                  if (EmulatorSettings.IsPipelineCacheArchived()) {
                      LOG_WARNING(Render, "Cannot auto-rebuild archived pipeline cache");
                      return false;
                  }

                  const auto& serial = Common::ElfInfo::Instance().GameSerial();
                  const auto cache_path =
                      Common::FS::GetUserPath(Common::FS::PathType::CacheDir) / serial;
                  std::error_code ec;
                  std::filesystem::remove_all(cache_path, ec);
                  if (ec) {
                      LOG_WARNING(Render, "Failed to reset incompatible {} cache: {}",
                                  serial, ec.message());
                      return false;
                  }

                  Storage::DataBase::Instance().Open();
                  Storage::DataBase::Instance().FinishPreload();
                  std::vector<u8> fresh_profile(sizeof(profile));
                  std::memcpy(fresh_profile.data(), &profile, sizeof(profile));
                  Storage::DataBase::Instance().Save(Storage::BlobType::ShaderProfile, "profile",
                                                     std::move(fresh_profile));
                  LOG_INFO(Render, "Rebuilt incompatible pipeline cache for {}", serial);
                  return true;
              };
          '''
          if 'rebuild_incompatible_cache' not in s:
              s = s.replace(marker, marker + helper, 1)

          size_pat = re.compile(
              r'''    if \(profile_data\.size\(\) != sizeof\(Shader::Profile\)\) \{.*?'''
              r'''        Storage::DataBase::Instance\(\)\.Close\(\);\s*'''
              r'''        return;\s*    \}''',
              re.S)
          size_repl = r'''    if (profile_data.size() != sizeof(Shader::Profile)) {
              LOG_WARNING(Render,
                          "Pipeline cache profile has unexpected size ({} != {}). Rebuilding it",
                          profile_data.size(), sizeof(Shader::Profile));
              rebuild_incompatible_cache();
              return;
          }'''
          s, n1 = size_pat.subn(size_repl, s, count=1)

          profile_pat = re.compile(
              r'''    if \(cached_profile != profile\) \{.*?'''
              r'''        Storage::DataBase::Instance\(\)\.Close\(\);\s*'''
              r'''        return;\s*    \}''',
              re.S)
          profile_repl = r'''    if (cached_profile != profile) {
              LOG_WARNING(Render,
                          "Pipeline cache isn't compatible with current system. Rebuilding it");
              rebuild_incompatible_cache();
              return;
          }'''
          s, n2 = profile_pat.subn(profile_repl, s, count=1)

          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Cache patch mismatch: size={n1}, profile={n2}")

          p.write_text(s, encoding="utf-8")
          print("Generic inFAMOUS cache self-heal applied")
          '@ | python -

      - name: Patch inFAMOUS sparse residency prefetch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          p = Path("source/src/video_core/buffer_cache/buffer_cache.cpp")
          s = p.read_text(encoding="utf-8")

          old = '''void BufferCache::EnsureResident(const Buffer* arena, u64 first_block, u64 last_block) {
              if (!resident_bits.empty()) {
          '''
          new = '''void BufferCache::EnsureResident(const Buffer* arena, u64 first_block, u64 last_block) {
              // inFAMOUS streams adjacent city sectors while the camera/player moves. Reserving
              // sparse backing only for the exact request causes repeated vkAllocateMemory +
              // sparse-bind/page-table work on the GPU command thread. Prefetch a 4 MiB window
              // inside the same arena so nearby sector loads hit already-resident blocks.
              constexpr u64 ResidencyPrefetchBytes = 4ULL * 1024ULL * 1024ULL;
              const u64 prefetch_blocks = std::max<u64>(1, ResidencyPrefetchBytes >> block_shift);
              const u64 arena_first = arena->cpu_addr >> block_shift;
              const u64 arena_last = (arena->cpu_addr + arena->size_bytes - 1) >> block_shift;
              const u64 rel_first = first_block - arena_first;
              const u64 rel_last = last_block - arena_first;
              first_block = arena_first + (rel_first / prefetch_blocks) * prefetch_blocks;
              const u64 rel_last_exclusive =
                  ((rel_last + 1 + prefetch_blocks - 1) / prefetch_blocks) * prefetch_blocks;
              last_block = std::min(arena_last, arena_first + rel_last_exclusive - 1);

              if (!resident_bits.empty()) {
          '''
          if old not in s:
              raise SystemExit("EnsureResident anchor not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("4 MiB sparse residency prefetch applied")
          '@ | python -

      - name: Patch First Light async pipeline creation
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          h = Path("source/src/video_core/renderer_vulkan/vk_pipeline_cache.h")
          s = h.read_text(encoding="utf-8")

          s = s.replace(
              "#include <array>\n#include <memory>\n#include <variant>",
              "#include <array>\n#include <condition_variable>\n#include <deque>\n#include <memory>\n#include <mutex>\n#include <thread>\n#include <variant>")

          meth = """private:
              bool RefreshGraphicsKey();
          """
          meth_new = """private:
              void AsyncCompileLoop(std::stop_token stoken);
              void DrainAsyncPipelines();
              bool RefreshGraphicsKey();
          """
          if meth not in s:
              raise SystemExit("PipelineCache private method anchor not found")
          s = s.replace(meth, meth_new, 1)

          fields = """    tsl::robin_map<size_t, std::unique_ptr<Program>> program_cache;
              tsl::robin_map<ComputePipelineKey, std::unique_ptr<ComputePipeline>> compute_pipelines;
              tsl::robin_map<GraphicsPipelineKey, std::unique_ptr<GraphicsPipeline>> graphics_pipelines;
          """
          fields_new = """    tsl::robin_map<size_t, std::unique_ptr<Program>> program_cache;
              tsl::robin_map<ComputePipelineKey, std::unique_ptr<ComputePipeline>> compute_pipelines;
              tsl::robin_map<GraphicsPipelineKey, std::unique_ptr<GraphicsPipeline>> graphics_pipelines;

              struct AsyncGraphicsJob {
                  GraphicsPipelineKey key{};
                  std::array<const Shader::Info*, MaxShaderStages> infos{};
                  std::array<Shader::RuntimeInfo, MaxShaderStages> runtime_infos{};
                  Shader::Gcn::FetchShaderData fetch{};
                  bool has_fetch{};
                  std::array<vk::ShaderModule, MaxShaderStages> modules{};
                  u64 hash{};
              };
              struct AsyncComputeJob {
                  ComputePipelineKey key{};
                  const Shader::Info* info{};
                  vk::ShaderModule module{};
              };
              struct AsyncGraphicsDone {
                  GraphicsPipelineKey key{};
                  std::unique_ptr<GraphicsPipeline> pipeline{};
                  u64 hash{};
                  GraphicsPipeline::SerializationSupport sdata{};
                  std::array<vk::ShaderModule, MaxShaderStages> modules{};
              };
              struct AsyncComputeDone {
                  ComputePipelineKey key{};
                  std::unique_ptr<ComputePipeline> pipeline{};
                  ComputePipeline::SerializationSupport sdata{};
                  vk::ShaderModule module{};
              };
              using AsyncJob = std::variant<AsyncGraphicsJob, AsyncComputeJob>;
              using AsyncDone = std::variant<AsyncGraphicsDone, AsyncComputeDone>;
              std::mutex async_mutex_;
              std::condition_variable_any async_cv_;
              std::deque<AsyncJob> async_jobs_;
              std::deque<AsyncDone> async_done_;
              std::array<std::jthread, 2> async_workers_{};
              tsl::robin_map<GraphicsPipelineKey, bool> pending_graphics_;
              tsl::robin_map<ComputePipelineKey, bool> pending_compute_;
              bool async_pipeline_compile_{};
          """
          if fields not in s:
              raise SystemExit("PipelineCache field anchor not found")
          s = s.replace(fields, fields_new, 1)
          h.write_text(s, encoding="utf-8")

          p = Path("source/src/video_core/renderer_vulkan/vk_pipeline_cache.cpp")
          s = p.read_text(encoding="utf-8")
          if '#include "common/elf_info.h"' not in s:
              s = s.replace('#include "common/hash.h"',
                            '#include "common/elf_info.h"\n#include "common/hash.h"')
          if '#include "common/thread.h"' not in s:
              s = s.replace('#include "common/path_util.h"',
                            '#include "common/path_util.h"\n#include "common/thread.h"')

          ctor_tail = """    pipeline_cache = std::move(cache);
          }

          PipelineCache::~PipelineCache() = default;
          """
          ctor_new = """    pipeline_cache = std::move(cache);

              if (Common::ElfInfo::Instance().GameSerial() == "CUSA00575") {
                  async_pipeline_compile_ = true;
                  for (auto& worker : async_workers_) {
                      worker = std::jthread([this](std::stop_token stoken) {
                          AsyncCompileLoop(stoken);
                      });
                  }
                  LOG_INFO(Render_Vulkan,
                           "First Light async pipeline compiler enabled with {} workers",
                           async_workers_.size());
              }
          }

          void PipelineCache::AsyncCompileLoop(std::stop_token stoken) {
              Common::SetCurrentThreadName("shadPS4:PipelineCompiler");
              while (!stoken.stop_requested()) {
                  AsyncJob job;
                  {
                      std::unique_lock lock{async_mutex_};
                      async_cv_.wait(lock, [&] {
                          return stoken.stop_requested() || !async_jobs_.empty();
                      });
                      if (stoken.stop_requested()) {
                          break;
                      }
                      job = std::move(async_jobs_.front());
                      async_jobs_.pop_front();
                  }

                  AsyncDone done = std::visit(
                      [this](auto&& item) -> AsyncDone {
                          using T = std::decay_t<decltype(item)>;
                          if constexpr (std::is_same_v<T, AsyncGraphicsJob>) {
                              GraphicsPipeline::SerializationSupport sdata{};
                              auto pipeline = std::make_unique<GraphicsPipeline>(
                                  instance, scheduler, desc_heap, nullptr, profile, item.key,
                                  vk::PipelineCache{}, item.infos, item.runtime_infos,
                                  item.has_fetch ? &item.fetch : nullptr, item.modules, sdata, false);
                              return AsyncGraphicsDone{item.key, std::move(pipeline), item.hash,
                                                       std::move(sdata), item.modules};
                          } else {
                              ComputePipeline::SerializationSupport sdata{};
                              auto pipeline = std::make_unique<ComputePipeline>(
                                  instance, scheduler, desc_heap, nullptr, profile,
                                  vk::PipelineCache{}, item.key, *item.info, item.module, sdata,
                                  false);
                              return AsyncComputeDone{item.key, std::move(pipeline),
                                                      std::move(sdata), item.module};
                          }
                      },
                      std::move(job));

                  {
                      std::scoped_lock lock{async_mutex_};
                      async_done_.emplace_back(std::move(done));
                  }
              }
          }

          void PipelineCache::DrainAsyncPipelines() {
              if (!async_pipeline_compile_) {
                  return;
              }

              std::deque<AsyncDone> done;
              {
                  std::scoped_lock lock{async_mutex_};
                  done.swap(async_done_);
              }

              for (auto& entry : done) {
                  std::visit(
                      [this](auto&& item) {
                          using T = std::decay_t<decltype(item)>;
                          if constexpr (std::is_same_v<T, AsyncGraphicsDone>) {
                              pending_graphics_.erase(item.key);
                              auto [it, inserted] = graphics_pipelines.try_emplace(item.key);
                              if (!inserted) {
                                  return;
                              }
                              it.value() = std::move(item.pipeline);
                              RegisterPipelineData(item.key, item.hash, item.sdata);
                              ++num_new_pipelines;

                              constexpr auto full_mask =
                                  vk::ColorComponentFlagBits::eR |
                                  vk::ColorComponentFlagBits::eG |
                                  vk::ColorComponentFlagBits::eB |
                                  vk::ColorComponentFlagBits::eA;
                              for (u32 cb = 0; cb < item.key.num_color_attachments; ++cb) {
                                  if (item.key.write_masks[cb] != full_mask) {
                                      ++nonfull_mask_pipelines;
                                      break;
                                  }
                              }
                              if (EmulatorSettings.IsShaderCollect()) {
                                  for (auto module : item.modules) {
                                      if (module) {
                                          module_related_pipelines[module].emplace_back(item.key);
                                      }
                                  }
                              }
                          } else {
                              pending_compute_.erase(item.key);
                              auto [it, inserted] = compute_pipelines.try_emplace(item.key);
                              if (!inserted) {
                                  return;
                              }
                              it.value() = std::move(item.pipeline);
                              RegisterPipelineData(item.key, item.sdata);
                              ++num_new_pipelines;
                              if (EmulatorSettings.IsShaderCollect() && item.module) {
                                  module_related_pipelines[item.module].emplace_back(item.key);
                              }
                          }
                      },
                      std::move(entry));
              }
          }

          PipelineCache::~PipelineCache() {
              for (auto& worker : async_workers_) {
                  if (worker.joinable()) {
                      worker.request_stop();
                  }
              }
              async_cv_.notify_all();
          }
          """
          if ctor_tail not in s:
              raise SystemExit("PipelineCache constructor tail anchor not found")
          s = s.replace(ctor_tail, ctor_new, 1)

          gfx_start = s.index("const GraphicsPipeline* PipelineCache::GetGraphicsPipeline(")
          gfx_end = s.index("\n// The stamp covers every register", gfx_start)
          gfx = s[gfx_start:gfx_end]
          gfx = gfx.replace(
              "    ++graphics_lookups;\n",
              "    DrainAsyncPipelines();\n    ++graphics_lookups;\n",
              1)

          pat = re.compile(
              r'''    const auto \[it, is_new\] = graphics_pipelines\.try_emplace\(graphics_key\);'''
              r'''.*?'''
              r'''    \}\n    // memcpy keeps the padding bytes deterministic for the memcmp-based compare\.''',
              re.S)
          repl = r'''    auto it = graphics_pipelines.find(graphics_key);
              if (it == graphics_pipelines.end()) {
                  const auto pipeline_hash = std::hash<GraphicsPipelineKey>{}(graphics_key);

                  const Shader::Gcn::FetchShaderData* fetch_shader =
                      fetch_shader_ref ? &fetch_shader_ref.Get() : nullptr;
                  Shader::Gcn::FetchShaderData live_fetch{};
                  if (!fetch_shader) {
                      const auto* vs_info = infos[static_cast<u32>(Shader::SwStage::Vertex)];
                      if (vs_info && vs_info->has_fetch_shader) {
                          if (Shader::Gcn::ParseFetchShader(*vs_info, live_fetch)) {
                              fetch_shader = &live_fetch;
                          }
                      }
                  }

                  if (async_pipeline_compile_) {
                      if (!pending_graphics_.contains(graphics_key)) {
                          AsyncGraphicsJob job{};
                          job.key = graphics_key;
                          job.infos = infos;
                          job.runtime_infos = runtime_infos;
                          if (fetch_shader) {
                              job.fetch = *fetch_shader;
                              job.has_fetch = true;
                          }
                          job.modules = modules;
                          job.hash = pipeline_hash;
                          pending_graphics_.try_emplace(graphics_key, true);
                          {
                              std::scoped_lock lock{async_mutex_};
                              async_jobs_.emplace_back(std::move(job));
                          }
                          async_cv_.notify_one();
                          LOG_INFO(Render_Vulkan,
                                   "Queued graphics pipeline {:#x} for async compilation",
                                   pipeline_hash);
                      }
                      last_graphics_pipeline = nullptr;
                      key_is_last = false;
                      return nullptr;
                  }

                  LOG_INFO(Render_Vulkan, "Compiling graphics pipeline {:#x}", pipeline_hash);
                  GraphicsPipeline::SerializationSupport sdata{};
                  if (pre_compile_hook_) {
                      pre_compile_hook_(pre_compile_user_);
                  }
                  auto [inserted_it, inserted] = graphics_pipelines.try_emplace(graphics_key);
                  ASSERT(inserted);
                  inserted_it.value() = std::make_unique<GraphicsPipeline>(
                      instance, scheduler, desc_heap, share_layouts ? &layouts : nullptr, profile,
                      graphics_key, *pipeline_cache, infos, runtime_infos, fetch_shader, modules,
                      sdata, false);
                  RegisterPipelineData(graphics_key, pipeline_hash, sdata);
                  ++num_new_pipelines;
                  it = inserted_it;
              }
              // memcpy keeps the padding bytes deterministic for the memcmp-based compare.'''
          gfx2, n = pat.subn(repl, gfx, count=1)
          if n != 1:
              raise SystemExit(f"Graphics async patch count={n}")
          s = s[:gfx_start] + gfx2 + s[gfx_end:]

          comp_start = s.index("const ComputePipeline* PipelineCache::GetComputePipeline()")
          comp_end = s.index("\nbool PipelineCache::RefreshGraphicsKey()", comp_start)
          comp = s[comp_start:comp_end]
          comp_new = r'''const ComputePipeline* PipelineCache::GetComputePipeline() {
              DrainAsyncPipelines();
              lookup_pipe_gen_ =
                  Skipcache::Framework::Instance().Gens().pipe_gen.load(std::memory_order_acquire);
              if (!RefreshComputeKey()) {
                  return nullptr;
              }

              auto it = compute_pipelines.find(compute_key);
              if (it != compute_pipelines.end()) {
                  return it->second.get();
              }

              const auto pipeline_hash = std::hash<ComputePipelineKey>{}(compute_key);
              if (async_pipeline_compile_) {
                  if (!pending_compute_.contains(compute_key)) {
                      AsyncComputeJob job{};
                      job.key = compute_key;
                      job.info = infos[0];
                      job.module = modules[0];
                      pending_compute_.try_emplace(compute_key, true);
                      {
                          std::scoped_lock lock{async_mutex_};
                          async_jobs_.emplace_back(std::move(job));
                      }
                      async_cv_.notify_one();
                      LOG_INFO(Render_Vulkan,
                               "Queued compute pipeline {:#x} for async compilation",
                               pipeline_hash);
                  }
                  return nullptr;
              }

              LOG_INFO(Render_Vulkan, "Compiling compute pipeline {:#x}", pipeline_hash);
              ComputePipeline::SerializationSupport sdata{};
              if (pre_compile_hook_) {
                  pre_compile_hook_(pre_compile_user_);
              }
              auto [inserted_it, inserted] = compute_pipelines.try_emplace(compute_key);
              ASSERT(inserted);
              inserted_it.value() = std::make_unique<ComputePipeline>(
                  instance, scheduler, desc_heap, share_layouts ? &layouts : nullptr, profile,
                  *pipeline_cache, compute_key, *infos[0], modules[0], sdata, false);
              RegisterPipelineData(compute_key, sdata);
              ++num_new_pipelines;
              return inserted_it->second.get();
          }
          '''
          s = s[:comp_start] + comp_new + s[comp_end:]

          p.write_text(s, encoding="utf-8")
          print("First Light async graphics/compute pipeline creation enabled")
          '@ | python -

      - name: Cache compiler output
        uses: hendrikmuhs/ccache-action@v1.2.21
        with:
          append-timestamp: false
          key: infamous-first-light-async-v2-windows

      - name: Configure
        shell: pwsh
        run: >-
          cmake --fresh -G Ninja
          -S "${{ github.workspace }}/source"
          -B "${{ github.workspace }}/build-infamous"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build shadPS4 inFAMOUS
        shell: pwsh
        run: >-
          cmake --build "${{ github.workspace }}/build-infamous"
          --config "${{ env.BUILD_TYPE }}"
          --parallel $env:NUMBER_OF_PROCESSORS

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ github.workspace }}/artifact" | Out-Null
          Copy-Item "${{ github.workspace }}/build-infamous/shadPS4.exe" "${{ github.workspace }}/artifact/shadPS4.exe"
          Copy-Item "${{ github.workspace }}/EXODUS_COMMIT.txt" "${{ github.workspace }}/artifact/EXODUS_COMMIT.txt"

      - name: Upload Windows test build
        uses: actions/upload-artifact@v7
        with:
          name: shadPS4-infamous-first-light-async-v2-windows-x64
          path: ${{ github.workspace }}/artifact/*
          if-no-files-found: error
          retention-days: 14
