name: inFAMOUS First Light EXODUS v6 - Windows x64

on:
  push:
    branches: [infamous-first-light-exodus-v6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infamous-first-light-exodus-v6-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  EXODUS_REF: GR2fork-EXODUS

jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - name: Clone GR2fork EXODUS
        shell: pwsh
        run: |
          git clone --recursive --branch "$env:EXODUS_REF" --depth 1 https://github.com/junminlee2004/GR2fork.git source
          Set-Location source
          git rev-parse HEAD | Out-File -Encoding ascii ../EXODUS_COMMIT.txt

      - name: Patch First Light cache self-heal
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          p = Path("source/src/video_core/renderer_vulkan/vk_pipeline_serialization.cpp")
          s = p.read_text(encoding="utf-8")

          if '#include "common/path_util.h"' not in s:
              s = s.replace('#include "common/serdes.h"',
                            '#include "common/path_util.h"\n#include "common/serdes.h"')

          old = '''    if (profile_data.size() != sizeof(Shader::Profile)) {
              LOG_WARNING(Render,
                          "Pipeline cache profile has unexpected size ({} != {}). Ignoring the cache",
                          profile_data.size(), sizeof(Shader::Profile));
              Storage::DataBase::Instance().Close();
              return;
          }

          Shader::Profile cached_profile{};
          std::memcpy(&cached_profile, profile_data.data(), sizeof(cached_profile));
          if (cached_profile != profile) {
              LOG_WARNING(Render,
                          "Pipeline cache isn't compatible with current system. Ignoring the cache");
              Storage::DataBase::Instance().Close();
              return;
          }
          '''

          new = '''    const auto reset_incompatible_cache = [&]() {
              Storage::DataBase::Instance().Close();
              if (EmulatorSettings.IsPipelineCacheArchived()) {
                  return false;
              }

              const auto cache_path =
                  Common::FS::GetUserPath(Common::FS::PathType::CacheDir) / "CUSA00575";
              std::error_code ec;
              std::filesystem::remove_all(cache_path, ec);
              if (ec) {
                  LOG_WARNING(Render, "Failed to reset incompatible First Light cache: {}",
                              ec.message());
                  return false;
              }

              Storage::DataBase::Instance().Open();
              Storage::DataBase::Instance().FinishPreload();
              std::vector<u8> fresh_profile(sizeof(profile));
              std::memcpy(fresh_profile.data(), &profile, sizeof(profile));
              Storage::DataBase::Instance().Save(Storage::BlobType::ShaderProfile, "profile",
                                                 std::move(fresh_profile));
              LOG_INFO(Render, "Reset incompatible First Light pipeline cache and created a fresh profile");
              return true;
          };

          if (profile_data.size() != sizeof(Shader::Profile)) {
              LOG_WARNING(Render,
                          "Pipeline cache profile has unexpected size ({} != {}). Rebuilding the cache",
                          profile_data.size(), sizeof(Shader::Profile));
              reset_incompatible_cache();
              return;
          }

          Shader::Profile cached_profile{};
          std::memcpy(&cached_profile, profile_data.data(), sizeof(cached_profile));
          if (cached_profile != profile) {
              LOG_WARNING(Render,
                          "Pipeline cache isn't compatible with current system. Rebuilding the cache");
              reset_incompatible_cache();
              return;
          }
          '''

          if old not in s:
              raise SystemExit("Expected WarmUp compatibility block not found")
          p.write_text(s.replace(old, new), encoding="utf-8")
          '@ | python -

      - name: Cache compiler output
        uses: hendrikmuhs/ccache-action@v1.2.21
        with:
          append-timestamp: false
          key: infamous-first-light-exodus-v6-windows

      - name: Configure
        shell: pwsh
        run: >-
          cmake --fresh -G Ninja
          -S "${{ github.workspace }}/source"
          -B "${{ github.workspace }}/build-exodus"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build shadPS4 EXODUS
        shell: pwsh
        run: >-
          cmake --build "${{ github.workspace }}/build-exodus"
          --config "${{ env.BUILD_TYPE }}"
          --parallel $env:NUMBER_OF_PROCESSORS

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ github.workspace }}/artifact" | Out-Null
          Copy-Item "${{ github.workspace }}/build-exodus/shadPS4.exe" "${{ github.workspace }}/artifact/shadPS4.exe"
          Copy-Item "${{ github.workspace }}/EXODUS_COMMIT.txt" "${{ github.workspace }}/artifact/EXODUS_COMMIT.txt"

      - name: Upload Windows test build
        uses: actions/upload-artifact@v7
        with:
          name: shadPS4-infamous-first-light-exodus-v6-windows-x64
          path: ${{ github.workspace }}/artifact/*
          if-no-files-found: error
          retention-days: 14
